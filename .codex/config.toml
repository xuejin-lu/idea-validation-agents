#:schema https://developers.openai.com/codex/config-schema.json

# Enable live web search for research.
web_search = "live"

# Allow routine workspace edits plus GitHub network access so the
# "開始" protocol can sync, generate research, commit, and push.
default_permissions = "startup-workspace"

[features]
network_proxy = true

[permissions.startup-workspace]
description = "Startup research workspace with GitHub sync access."
extends = ":workspace"

[permissions.startup-workspace.filesystem.":workspace_roots"]
"." = "write"
"**/*.env" = "deny"

[permissions.startup-workspace.network]
enabled = true

[permissions.startup-workspace.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
