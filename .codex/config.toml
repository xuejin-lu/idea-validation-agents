#:schema https://developers.openai.com/codex/config-schema.json

# Research requires live web search.
web_search = "live"

# Let routine workspace work stay sandboxed, but automatically review
# boundary requests such as Git metadata writes needed for commit/push.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "startup-workspace"

[features]
network_proxy = true

[permissions.startup-workspace]
description = "Startup research workspace with GitHub sync access."
extends = ":workspace"

[permissions.startup-workspace.filesystem.":workspace_roots"]
"**/*.env" = "deny"

[permissions.startup-workspace.network]
enabled = true

[permissions.startup-workspace.network.domains]
"github.com" = "allow"
"api.github.com" = "allow"
"raw.githubusercontent.com" = "allow"
